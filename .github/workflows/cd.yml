name: CD 
# trigger when the CI workflow is completed
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: ["main"]

env:
  IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/AfrawyStore"
jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # only allow this workflow to run when the CI workflow is completed successfully
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 3. Build and push the Docker image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # use current directory
          push: true
          # image will be tagged two times with latest and the commit sha to each one
          tags: ${{ env.IMAGE_NAME }}:latest, ${{ env.IMAGE_NAME }}:${{github.sha}}
      # 4. SSH into the VPS and run the deployment commands
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Login to Docker Hub on VPS
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # Remove the old container if it exists
            docker rm -f ${{ env.IMAGE_NAME }} || true
            
            # Pull the new image
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            # Run the new container
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              -p 80:80 \
              -e "ASPNETCORE_ENVIRONMENT=Production" \
              ${{ env.IMAGE_NAME }}:latest
    