name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger in GitHub UI

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install .NET (Updated to v4)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Cache NuGet packages to speed up builds
      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 5. Build the code
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 6. Run tests (safely uses --no-build because the step above just built it on THIS machine)
      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal